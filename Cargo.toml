[package]
name = "os-switcher"
version = "0.1.3"
description = "Choose the next-boot or default OS on a UEFI multiboot machine (Windows/Linux), UEFI + BCD aware."
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Le-Syl21"]
repository = "https://github.com/Le-Syl21/os_switcher"
readme = "README.md"

[lib]
name = "os_switcher"
path = "src/lib.rs"

# Two faces, two binaries of different weight: the CLI is small and pulls no GUI
# stack, while `os-switcher-gui` (behind the `gui` feature) links eframe/egui.
[[bin]]
name = "os-switcher"
path = "src/bin/os-switcher.rs"

[[bin]]
name = "os-switcher-gui"
path = "src/bin/os-switcher-gui.rs"
required-features = ["gui"]

[features]
default = []
# `eframe` is the only GUI dependency: it re-exports egui (used as
# `eframe::egui`) and pulls its own default renderer, so there is nothing else
# to declare or keep in step.
gui = ["dep:eframe"]
# Lets the `egui-mcp` server attach to a running instance, to drive and
# screenshot the UI. Development only.
inspection = ["gui", "eframe/inspection"]

[dependencies]
regf-rs = "0.1"
clap = { version = "4", features = ["derive"] }
rust-i18n = "4"
sys-locale = "0.3"
# The only GUI dependency: eframe re-exports egui (used as `eframe::egui`) and
# brings the windowing and renderer. Render with glow (OpenGL), not the default
# wgpu — wgpu roughly doubles the dependency tree and its D3D12 backend fails to
# build on Windows (the reason exiftool-rs pins glow too).
eframe = { version = "0.36", optional = true, default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "web_screen_reader",
    "x11",
] }

# efivar is the real NVRAM backend; it only builds on Linux and Windows. The
# core logic is backend-agnostic and testable without it.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
efivar = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The pipe protocol between the app (client) and the service (SYSTEM): a tiny,
# strictly-typed JSON message, so serde is Windows-only.
[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SCM dispatcher and control handler; it depends on windows-sys itself, so
# no second Windows binding is pulled.
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
