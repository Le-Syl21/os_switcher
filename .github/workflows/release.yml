name: Release

# Builds the binaries for Linux and Windows (x64 + ARM64) and attaches them to
# a GitHub Release when a "vX.Y.Z" tag is pushed. Uses native runners per target
# so the eframe GUI builds without cross-compilation.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu,  kind: linux }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, kind: linux }
          - { os: windows-2022,     target: x86_64-pc-windows-msvc,    kind: windows }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,   kind: windows }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GUI build dependencies (Linux)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Build
        run: cargo build --release -p os-switcher -p os-switcher-helper

      - name: Package (Linux)
        if: matrix.kind == 'linux'
        run: |
          name="os-switcher-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name"
          cp target/release/os-switcher target/release/os-switcher-helper "$name/"
          cp -r packaging README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $name = "os-switcher-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item target/release/os-switcher.exe,target/release/os-switcher-helper.exe $name/
          Copy-Item README.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          draft: true
          generate_release_notes: true
