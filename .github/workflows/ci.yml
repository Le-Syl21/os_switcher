name: CI

# The gate (fmt/clippy/tests) runs on pull requests and on demand. Everything
# heavier — building the release binaries and signing them — happens only at a
# "vX.Y.Z" tag: work lands directly on `main`, so a build per commit would be
# noise, and a signature commits the owner's identity, so it must never go out
# without an explicit, tagged release.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Run the JavaScript actions on Node 24: several pinned versions still declare
  # Node 20 in their metadata, which the runner now warns is deprecated. This
  # forces the supported runtime without waiting for each action to update.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          components: rustfmt, clippy

      # Before anything is built or signed, make the tag agree with the version
      # the release will carry: a v0.1.2 tag over a Cargo.toml still saying 0.1.1
      # would publish a mislabeled release with nobody noticing.
      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          # `cargo metadata --no-deps` reports the manifest version without
          # needing a Cargo.lock (this repo does not track one), and without
          # assuming where the `version` field sits in Cargo.toml.
          crate=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name=="os-switcher") | .version')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $crate — update Cargo.toml, then re-tag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME <-> Cargo.toml $crate: OK"

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Format
        run: cargo fmt --check

      - name: Clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Each runner builds for its own architecture natively (no --target), so
      # the matrix carries a clean asset label rather than the Rust triple:
      # `linux-x86_64` reads better on a release page than
      # `x86_64-unknown-linux-gnu`, and the "-msvc"/"-gnu" ABI suffix is noise
      # to whoever is downloading.
      matrix:
        include:
          - { os: ubuntu-24.04,     label: linux-x86_64,    kind: linux }
          - { os: ubuntu-24.04-arm, label: linux-aarch64,   kind: linux }
          - { os: windows-2022,     label: windows-x86_64,  kind: windows }
          - { os: windows-11-arm,   label: windows-aarch64, kind: windows }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Install GUI build dependencies (Linux)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Build
        run: cargo build --release -p os-switcher

      - name: Package (Linux)
        if: matrix.kind == 'linux'
        run: |
          name="os-switcher-${GITHUB_REF_NAME}-${{ matrix.label }}"
          mkdir -p "$name"
          cp target/release/os-switcher "$name/"
          cp -r packaging README.md "$name/"
          tar -czf "$name.tar.gz" "$name"

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $name = "os-switcher-$env:GITHUB_REF_NAME-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item target/release/os-switcher.exe $name/
          Copy-Item README.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: os-switcher-${{ github.ref_name }}-${{ matrix.label }}
          path: os-switcher-${{ github.ref_name }}-${{ matrix.label }}.*

  # Authenticode-sign the Windows binaries with ssign — the Linux runner signs
  # them via Certum (no Windows, no vendor stack). Behind the `signing`
  # environment: the Certum secrets are environment secrets (unreadable from the
  # `build` job, which declares no environment) and a signature commits the
  # owner's identity, so it must never go out without explicit approval.
  sign-windows:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: signing
    strategy:
      matrix:
        label: [windows-x86_64, windows-aarch64]
    steps:
      - name: Install ssign (prebuilt binary from the latest release)
        run: |
          curl -fsSL https://github.com/Le-Syl21/ssign/releases/latest/download/ssign-linux-x86_64.tar.gz | tar xz
          sudo install -m755 ssign /usr/local/bin/ssign

      - name: Download the archive
        uses: actions/download-artifact@v8
        with:
          name: os-switcher-${{ github.ref_name }}-${{ matrix.label }}
          path: dl

      - name: Sign os-switcher.exe with ssign (via Certum)
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          cd dl
          name="os-switcher-${GITHUB_REF_NAME}-${{ matrix.label }}"
          unzip -o "$name.zip"
          ssign --verbose \
            -n "os-switcher" -u "https://github.com/${{ github.repository }}" \
            "$name/os-switcher.exe"

          sudo apt-get update -qq && sudo apt-get install -y osslsigncode
          # Check the facts, not the presence of a sentence: a mismatched digest
          # and an untimestamped signature both print reassuring lines, yet
          # Windows rejects the first and treats the second as expired the day
          # the certificate does.
          out=$(osslsigncode verify "$name/os-switcher.exe" 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "MISMATCH" && { echo "::error::invalid Authenticode digest"; exit 1; }
          echo "$out" | grep -q "Timestamp is not available" && { echo "::error::signature is not timestamped"; exit 1; }
          echo "$out" | grep -q "Signature verification: ok" || { echo "::error::signature verification failed"; exit 1; }

          rm -f "$name.zip"
          zip -r "$name.zip" "$name"

      - name: Re-upload the signed archive
        uses: actions/upload-artifact@v7
        with:
          name: os-switcher-${{ github.ref_name }}-${{ matrix.label }}
          path: dl/os-switcher-${{ github.ref_name }}-${{ matrix.label }}.zip
          overwrite: true

  release:
    needs: [build, sign-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
          # Pre-release tags (v*-rc/-beta) are flagged as such in the GitHub UI.
          prerelease: ${{ contains(github.ref_name, '-') }}
