name: CI

# The gate (fmt/clippy/tests) runs on pull requests and on demand. Everything
# heavier — building the release binaries and signing them — happens only at a
# "vX.Y.Z" tag: work lands directly on `main`, so a build per commit would be
# noise, and a signature commits the owner's identity, so it must never go out
# without an explicit, tagged release.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Run the JavaScript actions on Node 24: several pinned versions still declare
  # Node 20 in their metadata, which the runner now warns is deprecated. This
  # forces the supported runtime without waiting for each action to update.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          components: rustfmt, clippy

      # Before anything is built or signed, make the tag agree with the version
      # the release will carry: a v0.1.2 tag over a Cargo.toml still saying 0.1.1
      # would publish a mislabeled release with nobody noticing.
      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          # `cargo metadata --no-deps` reports the manifest version without
          # needing a Cargo.lock (this repo does not track one), and without
          # assuming where the `version` field sits in Cargo.toml.
          crate=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name=="os-switcher") | .version')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $crate — update Cargo.toml, then re-tag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME <-> Cargo.toml $crate: OK"

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Format
        run: cargo fmt --check

      # Lint and test both faces: the default build is the CLI (no GUI stack),
      # `--features gui` adds the eframe/egui binary.
      - name: Clippy (CLI)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (GUI)
        run: cargo clippy --all-targets --features gui -- -D warnings

      - name: Tests (CLI)
        run: cargo test

      - name: Tests (GUI)
        run: cargo test --features gui

      # The gate runs on Linux, so `#[cfg(windows)]` code (the service broker,
      # the elevation back-end) is otherwise only compiled at a tag, on the
      # Windows build runners. Type-check it here on every PR against the
      # windows-gnu target — no linker needed for `cargo check`/`clippy`, so it
      # runs on the Linux runner and catches Windows-only breakage early.
      - name: Type-check the Windows target
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --target x86_64-pc-windows-gnu --all-targets -- -D warnings
          cargo clippy --target x86_64-pc-windows-gnu --all-targets --features gui -- -D warnings

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Each runner builds for its own architecture natively (no --target), so
      # the matrix carries a clean asset label rather than the Rust triple:
      # `linux-x86_64` reads better on a release page than
      # `x86_64-unknown-linux-gnu`, and the "-msvc"/"-gnu" ABI suffix is noise
      # to whoever is downloading.
      matrix:
        include:
          - { os: ubuntu-24.04,     label: linux-x86_64,    kind: linux }
          - { os: ubuntu-24.04-arm, label: linux-aarch64,   kind: linux }
          - { os: windows-2022,     label: windows-x86_64,  kind: windows }
          - { os: windows-11-arm,   label: windows-aarch64, kind: windows }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Install GUI build dependencies (Linux)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      # Two binaries of different weight: the small CLI (default build, no GUI
      # stack) and the GUI (behind the `gui` feature).
      - name: Build CLI
        run: cargo build --release --bin os-switcher

      - name: Build GUI
        run: cargo build --release --bin os-switcher-gui --features gui

      - name: Package (Linux)
        if: matrix.kind == 'linux'
        run: |
          for variant in os-switcher os-switcher-gui; do
            name="${variant}-${GITHUB_REF_NAME}-${{ matrix.label }}"
            mkdir -p "$name"
            cp "target/release/${variant}" "$name/"
            cp -r packaging README.md "$name/"
            tar -czf "$name.tar.gz" "$name"
          done

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          foreach ($variant in "os-switcher", "os-switcher-gui") {
            $name = "$variant-$env:GITHUB_REF_NAME-${{ matrix.label }}"
            New-Item -ItemType Directory -Force -Path $name | Out-Null
            Copy-Item "target/release/$variant.exe" $name/
            Copy-Item README.md $name/
            Compress-Archive -Path $name -DestinationPath "$name.zip"
          }

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: os-switcher-${{ github.ref_name }}-${{ matrix.label }}
          path: os-switcher-${{ github.ref_name }}-${{ matrix.label }}.*

      - name: Upload GUI archive
        uses: actions/upload-artifact@v7
        with:
          name: os-switcher-gui-${{ github.ref_name }}-${{ matrix.label }}
          path: os-switcher-gui-${{ github.ref_name }}-${{ matrix.label }}.*

  # Authenticode-sign the Windows binaries with ssign — the Linux runner signs
  # them via Certum (no Windows, no vendor stack). Behind the `signing`
  # environment: the Certum secrets are environment secrets (unreadable from the
  # `build` job, which declares no environment) and a signature commits the
  # owner's identity, so it must never go out without explicit approval.
  sign-windows:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Install ssign (prebuilt binary from the latest release)
        run: |
          curl -fsSL https://github.com/Le-Syl21/ssign/releases/latest/download/ssign-linux-x86_64.tar.gz | tar xz
          sudo install -m755 ssign /usr/local/bin/ssign

      # All four Windows archives (CLI + GUI, x86_64 + aarch64) into one dir, so
      # every exe is signed under a SINGLE Certum login: SimplySign's OTP is
      # short-lived and one-shot, so a job-per-binary (four logins) fails after
      # the first. One login, one ssign call over all of them.
      - name: Download the Windows archives
        uses: actions/download-artifact@v8
        with:
          pattern: "*-windows-*"
          path: dl
          merge-multiple: true

      - name: Sign every Windows exe with ssign (via Certum)
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          cd dl
          for z in *.zip; do unzip -o "$z"; done
          mapfile -t exes < <(find . -name '*.exe' | sort)
          echo "signing: ${exes[*]}"
          ssign --verbose \
            -n "os-switcher" -u "https://github.com/${{ github.repository }}" \
            "${exes[@]}"

          sudo apt-get update -qq && sudo apt-get install -y osslsigncode
          # Check the facts, not the presence of a sentence: a mismatched digest
          # and an untimestamped signature both print reassuring lines, yet
          # Windows rejects the first and treats the second as expired the day
          # the certificate does.
          for exe in "${exes[@]}"; do
            out=$(osslsigncode verify "$exe" 2>&1) || true
            echo "== $exe =="; echo "$out"
            echo "$out" | grep -q "MISMATCH" && { echo "::error::$exe: invalid Authenticode digest"; exit 1; }
            echo "$out" | grep -q "Timestamp is not available" && { echo "::error::$exe: signature is not timestamped"; exit 1; }
            echo "$out" | grep -q "Signature verification: ok" || { echo "::error::$exe: signature verification failed"; exit 1; }
          done

          # Repackage each archive around its now-signed exe.
          for z in *.zip; do
            name="${z%.zip}"
            rm -f "$z"
            zip -r "$z" "$name"
          done

      - name: Re-upload signed CLI (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: os-switcher-${{ github.ref_name }}-windows-x86_64
          path: dl/os-switcher-${{ github.ref_name }}-windows-x86_64.zip
          overwrite: true

      - name: Re-upload signed CLI (aarch64)
        uses: actions/upload-artifact@v7
        with:
          name: os-switcher-${{ github.ref_name }}-windows-aarch64
          path: dl/os-switcher-${{ github.ref_name }}-windows-aarch64.zip
          overwrite: true

      - name: Re-upload signed GUI (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: os-switcher-gui-${{ github.ref_name }}-windows-x86_64
          path: dl/os-switcher-gui-${{ github.ref_name }}-windows-x86_64.zip
          overwrite: true

      - name: Re-upload signed GUI (aarch64)
        uses: actions/upload-artifact@v7
        with:
          name: os-switcher-gui-${{ github.ref_name }}-windows-aarch64
          path: dl/os-switcher-gui-${{ github.ref_name }}-windows-aarch64.zip
          overwrite: true

  release:
    needs: [build, sign-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
          # Pre-release tags (v*-rc/-beta) are flagged as such in the GitHub UI.
          prerelease: ${{ contains(github.ref_name, '-') }}
