version: 2

# Third-party actions are pinned by commit SHA: a version tag is mutable (in
# March 2026, 76 of trivy-action's 77 tags were force-pushed to malicious
# code), only a SHA is immutable. The trade-off is that pinned actions no
# longer receive fixes on their own — that is Dependabot's job here: it bumps a
# pinned SHA and keeps the `# vX.Y.Z` comment next to it in step.
updates:
  # Crates: one grouped PR a month for the routine bumps, and a separate PR
  # per major, so a breaking change never holds the rest of them hostage.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      # egui and its satellites move in lockstep: eframe, egui_glow, egui-winit
      # and egui_inspection each require an exact egui minor, so a PR bumping
      # one of them alone cannot build. One group, one PR — and it takes every
      # update type, because for a 0.x crate Dependabot calls 0.36 -> 0.37 a
      # *minor* update while Cargo treats it as breaking.
      egui:
        patterns: ["egui", "egui-*", "egui_*", "eframe"]
      crates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore


  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One grouped PR rather than one per action.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    ignore:
      # dtolnay/rust-toolchain has no "versions": the ref names the Rust
      # toolchain to install, not a release of the action. Dependabot would
      # read it as an action version and propose bumps to tags that do not
      # exist; the toolchain to use lives in `with: toolchain:`, out of reach.
      - dependency-name: dtolnay/rust-toolchain
