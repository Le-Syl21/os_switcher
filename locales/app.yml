  de: Herunterfahren
  es: Apagar
confirm_reboot_title:
  en: Restart now?
  fr: Redémarrer maintenant ?
  de: Jetzt neu starten?
  es: ¿Reiniciar ahora?
confirm_reboot_body:
  en: Unsaved work in other applications will be lost.
  fr: Le travail non enregistré dans les autres applications sera perdu.
  de: Nicht gespeicherte Arbeit in anderen Anwendungen geht verloren.
  es: Se perderá el trabajo no guardado en otras aplicaciones.
confirm_shutdown_title:
  en: Shut down now?
  fr: Éteindre maintenant ?
  de: Jetzt herunterfahren?
  es: ¿Apagar ahora?
confirm_shutdown_body:
  en: Unsaved work in other applications will be lost.
  fr: Le travail non enregistré dans les autres applications sera perdu.
  de: Nicht gespeicherte Arbeit in anderen Anwendungen geht verloren.
  es: Se perderá el trabajo no guardado en otras aplicaciones.
