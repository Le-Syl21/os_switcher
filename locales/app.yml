  en: Confirm
  fr: Confirmer
  de: Bestätigen
  es: Confirmar
cancel:
  en: Cancel
  fr: Annuler
  de: Abbrechen
  es: Cancelar

language:
  en: Language
  fr: Langue
  de: Sprache
  es: Idioma
working:
  en: Working…
  fr: En cours…
  de: Arbeitet…
  es: Trabajando…

empty_title:
  en: No boot entries found
  fr: Aucune entrée de démarrage trouvée
  de: Keine Starteinträge gefunden
  es: No se encontraron entradas de arranque
empty_body:
  en: This machine may not boot in UEFI mode, or the firmware variables are not readable.
  fr: Cette machine ne démarre peut-être pas en mode UEFI, ou les variables du firmware ne sont pas lisibles.
  de: Dieser Rechner startet möglicherweise nicht im UEFI-Modus, oder die Firmware-Variablen sind nicht lesbar.
  es: Puede que este equipo no arranque en modo UEFI, o que las variables del firmware no sean legibles.

no_prompt:
  en: Skip the approval prompt
  fr: Ne plus demander d'autorisation
  de: Bestätigung überspringen
  es: Omitir la solicitud de permiso
no_prompt_hint:
  en: One-time setup so os-switcher gets the rights it needs without asking again.
  fr: Configuration unique pour qu'os-switcher obtienne les droits nécessaires sans redemander.
  de: Einmalige Einrichtung, damit os-switcher ohne erneute Nachfrage die nötigen Rechte erhält.
  es: Configuración única para que os-switcher obtenga los permisos necesarios sin volver a preguntar.
no_prompt_on:
  en: No more prompts.
  fr: Plus aucune demande.
  de: Keine Nachfragen mehr.
  es: Sin más solicitudes.
install:
  en: Set up
  fr: Configurer
  de: Einrichten
  es: Configurar
uninstall:
  en: Undo
  fr: Annuler
  de: Rückgängig
  es: Deshacer
hint_privilege:
  en: Changing the boot OS asks for authorization.
  fr: Changer l'OS de démarrage demande une autorisation.
  de: Das Ändern des Boot-Betriebssystems erfordert eine Berechtigung.
  es: Cambiar el SO de arranque solicita autorización.

elevation_refused:
  en: "OS Switcher needs administrator rights: on Windows, even reading the firmware boot settings requires them. The launch was cancelled."
  fr: "OS Switcher a besoin des droits administrateur : sous Windows, même lire la configuration de démarrage du firmware les exige. Le lancement a été annulé."
  de: "OS Switcher benötigt Administratorrechte: unter Windows erfordert schon das Lesen der Firmware-Starteinstellungen sie. Der Start wurde abgebrochen."
  es: "OS Switcher necesita permisos de administrador: en Windows, incluso leer la configuración de arranque del firmware los requiere. Se canceló el inicio."

menu_add_start:
  en: Start menu
  fr: Menu Démarrer
  de: Startmenü
  es: Menú Inicio
menu_add_launcher:
  en: Launcher
  fr: Lanceur
  de: Startprogramm
  es: Lanzador
menu_add_hint_start:
  en: Add OS Switcher to the Start menu. From there, right-click it to pin it to the taskbar — Windows does not allow an application to do that itself.
  fr: Ajoute OS Switcher au menu Démarrer. De là, un clic droit permet de l'épingler à la barre des tâches — Windows n'autorise pas une application à le faire elle-même.
  de: Fügt OS Switcher zum Startmenü hinzu. Von dort lässt es sich per Rechtsklick an die Taskleiste anheften — Windows erlaubt einer Anwendung nicht, das selbst zu tun.
  es: Añade OS Switcher al menú Inicio. Desde allí, con el botón derecho puedes anclarlo a la barra de tareas — Windows no permite que una aplicación lo haga por sí misma.
menu_add_hint_launcher:
  en: Add OS Switcher to the application menu, for this user only.
  fr: Ajoute OS Switcher au menu des applications, pour cet utilisateur seulement.
  de: Fügt OS Switcher nur für diesen Benutzer zum Anwendungsmenü hinzu.
  es: Añade OS Switcher al menú de aplicaciones, solo para este usuario.
menu_remove_hint:
  en: Remove the entry.
  fr: Retirer l'entrée.
  de: Eintrag entfernen.
  es: Quitar la entrada.
