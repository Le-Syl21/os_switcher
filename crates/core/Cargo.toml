[package]
name = "os-switcher-core"
version = "0.1.0"
description = "Unified next-boot / default-OS switcher over UEFI (BootOrder/BootNext) and Windows BCD."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
os-switcher-efi.workspace = true
os-switcher-bcd.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
regf-rs.workspace = true
